name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-image.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omp-remote-agents

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plain single-manifest push (no OCI index, no unknown/unknown
          # attestation entries): digest-pinned pulls on the amd64 gVisor
          # substrate must resolve straight to the linux/amd64 manifest.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the pushed image
        run: |
          DIGEST="ghcr.io/${{ github.repository_owner }}/omp-remote-agents@${{ steps.push.outputs.digest }}"
          echo "Smoke-testing $DIGEST"
          docker run --rm --entrypoint /bin/sh "$DIGEST" -euxc '
            bun --version
            omp --version | grep 18.12.6
            test -x /usr/local/bin/omp
            test -x /usr/local/bin/ax-task-runner
            ax-task-runner -h 2>&1 | head -3 || true
            test -x /bin/sh
            echo smoke-ok
          '

      - name: Output digest
        run: echo "digest=${{ steps.push.outputs.digest }}"
